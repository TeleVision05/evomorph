# Quick laptop configuration. Sections are owned by the stage that reads them:
#   sim, fitness  -> evomorph.config (core)
# Later stages append their own sections (evolution, map_elites, experiment, ...).

sim:
  duration: 10.0          # s measured after settling
  timestep: 0.002         # s physics step (implicitfast)
  settle_time: 1.0        # s standing at rest pose before measurement
  control_rate: 50.0      # Hz controller update
  init_noise: 0.01        # rad std of seeded spawn joint noise
  spawn_clearance: 0.005  # m
  fall_tilt_deg: 75.0
  fall_contact_time: 0.25   # s of torso-ground contact ...
  fall_contact_window: 1.0  # ... within this sliding window = fall
  max_linear_speed: 5.0     # m/s glitch guard (absolute)
  max_speed_per_size: 10.0  # body sizes/s glitch guard (size = torso length + 2 x reach)
  max_angular_speed: 40.0   # rad/s glitch guard
  max_height_gain: 1.0      # m glitch guard (launch, above start clearance)
  max_height_gain_per_size: 1.0
  max_ground_penetration: 0.05   # m torso centre below local ground
  max_contact_penetration: 0.12  # m any geom sunk into the ground

# fitness = (sustained_velocity / velocity_scale) x product of quality factors
#           - w_fall x fell - w_still x stationary   (see evomorph/simulation/fitness.py)
fitness:
  velocity_scale: 0.2     # m/s
  tilt_scale: 1.0472      # rad: upright factor hits 0
  lateral_ratio: 0.5      # sideways deviation per metre forward that halves the lateral factor
  yaw_scale: 0.7          # rad of heading excursion that halves the rotation factor
  cot_scale: 2.0          # cost of transport that halves the energy factor
  slip_penalty: 0.5       # progress share lost when every stance skates
  airborne_allowance: 0.05
  airborne_scale: 0.5
  effort_scale: 0.5       # mean (torque/limit)^2 that halves the effort factor
  smooth_scale: 3.0       # RMS torso acceleration in g that halves the smoothness factor
  still_distance: 0.1     # m
  w_progress: 1.0
  w_upright: 1.0          # factor exponents: 0 switches a factor off
  w_lateral: 1.0
  w_rotation: 1.0
  w_energy: 1.0
  w_slip: 1.0
  w_support: 1.0
  w_airborne: 1.0
  w_effort: 1.0
  w_smoothness: 1.0
  w_fall: 1.0             # additive
  w_still: 0.2            # additive
  penalty_cap: 2.0        # backward progress floor

# --- evolution (evomorph/evolution/settings.py) --------------------------------
# Shared by both algorithms, plus the GA's own settings. Budget is counted in
# simulations (genomes x runs per genome), so GA and MAP-Elites compare fairly.
# Measured on this laptop: 17.2 simulations/s with 6 workers, so 6000 sims is
# about 6 minutes.
evolution:
  algorithm: ga             # ga | map_elites
  mode: joint               # joint | controller (body frozen) | morphology (controller frozen)
  seed: 0
  budget: 6000              # simulations
  workers: 6                # process pool; hard-capped at 6 so the laptop stays usable
  frozen_body: quadruped    # controller mode: reference name or genome JSON path
  frozen_controller: quadruped  # morphology mode: whose controller is frozen
  kind: cpg
  # Every genome is scored on all runs; fitness is their mean, metrics are
  # averaged. Three spawn-noise seeds against the winner's curse, and three
  # friction values (dusty floor 0.6 to rubber on concrete 1.0) so that feet
  # skating on a slippery floor cost fitness.
  evaluation:
    aggregate: mean
    runs:
      - {env: {kind: flat, friction: 0.6}, seed: 0}
      - {env: {kind: flat, friction: 0.8}, seed: 1}
      - {env: {kind: flat, friction: 1.0}, seed: 2}
  population_size: 48
  elite_count: 2
  tournament_size: 3
  crossover_prob: 0.5
  max_generations: null     # null: run until the budget is spent
  mutation:
    gene_rate: 0.12         # per-gene probability of a Gaussian step
    sigma: 0.10             # step std as a fraction of the gene's range (magnitude)
    reset_rate: 0.02        # per-gene probability of a uniform re-draw
    p_limb_pairs: 0.05      # add/remove a limb pair (per-limb genes resized)
    p_segments: 0.05        # toggle one/two-segment limbs
    p_gait: 0.05            # re-draw the gait pattern
    p_phase: 0.20           # one limb's phase offset moves ...
    phase_sigma: 0.25       # ... by this fraction of its range
  diversity:
    method: sharing         # sharing | none (none also disables plan elites and immigrants)
    sharing_radius: 0.15    # normalised gene distance (random pairs sit near 0.35)
    sharing_alpha: 1.0
    plan_elites: 1          # best of each body plan (limbs x segments) survives
    immigrant_fraction: 0.05

# --- MAP-Elites (evomorph/evolution/map_elites.py, archive.py) ---------------
# Shares evolution.{mode, seed, budget, workers, evaluation, mutation}.
map_elites:
  batch_size: 48
  init_size: 192            # random genomes before variation starts
  crossover_prob: 0.2
  descriptors: [sustained_velocity, energy_efficiency]
  bins: [10, 10]
  # Chosen from a measured probe (200 random genomes + the references on
  # friction 0.6 and 1.0): movers reach up to 0.64 m/s and efficiency 0.55;
  # the references sit near 0.4 m/s and 0.45. See evomorph/evolution/archive.py.
  ranges: [[0.0, 0.8], [0.0, 0.7]]
