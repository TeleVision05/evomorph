# Research configuration: longer runs for the comparison experiments
# (brief section 9). sim and fitness are the core defaults, repeated here so the
# file is self-contained; change them only together with the core.
#
# Budget arithmetic (measured on this laptop with 6 workers while it was shared
# with other work, see docs/EVOLUTION.md): 8-17 simulations/s, 13.8/s for the
# quick GA run. 30000 simulations is therefore 30-60 minutes per run, and three
# modes x GA + MAP-Elites x 3 seeds = 12 runs is 6-12 hours: an overnight job.

sim:
  duration: 10.0
  timestep: 0.002
  settle_time: 1.0
  control_rate: 50.0
  init_noise: 0.01
  spawn_clearance: 0.005
  fall_tilt_deg: 75.0
  fall_contact_time: 0.25
  fall_contact_window: 1.0
  max_linear_speed: 5.0
  max_speed_per_size: 10.0
  max_angular_speed: 40.0
  max_height_gain: 1.0
  max_height_gain_per_size: 1.0
  max_ground_penetration: 0.05
  max_contact_penetration: 0.12

fitness:
  velocity_scale: 0.2
  tilt_scale: 1.0472
  lateral_ratio: 0.5
  yaw_scale: 0.7
  cot_scale: 2.0
  slip_penalty: 0.5
  airborne_allowance: 0.05
  airborne_scale: 0.5
  effort_scale: 0.5
  smooth_scale: 3.0
  still_distance: 0.1
  w_progress: 1.0
  w_upright: 1.0
  w_lateral: 1.0
  w_rotation: 1.0
  w_energy: 1.0
  w_slip: 1.0
  w_support: 1.0
  w_airborne: 1.0
  w_effort: 1.0
  w_smoothness: 1.0
  w_fall: 1.0
  w_still: 0.2
  penalty_cap: 2.0

evolution:
  algorithm: ga
  mode: joint
  seed: 0
  budget: 30000             # simulations (genomes x runs); equal for every condition
  workers: 6                # hard-capped at 6 so the laptop stays usable
  frozen_body: quadruped
  frozen_controller: quadruped
  kind: cpg
  # Four runs per genome: four spawn-noise seeds and a friction sweep from a
  # slippery 0.5 to a grippy 1.25, so skating feet and seed luck both cost.
  # Held-out testing (terrains, unseen frictions) belongs to the experiment stage.
  evaluation:
    aggregate: mean
    runs:
      - {env: {kind: flat, friction: 0.5}, seed: 0}
      - {env: {kind: flat, friction: 0.75}, seed: 1}
      - {env: {kind: flat, friction: 1.0}, seed: 2}
      - {env: {kind: flat, friction: 1.25}, seed: 3}
  # 64 x 4 = 256 simulations per generation, so 30000 is ~117 generations.
  population_size: 64
  elite_count: 2
  tournament_size: 3
  crossover_prob: 0.5
  max_generations: null
  mutation:
    gene_rate: 0.12
    sigma: 0.10
    reset_rate: 0.02
    p_limb_pairs: 0.05
    p_segments: 0.05
    p_gait: 0.05
    p_phase: 0.20
    phase_sigma: 0.25
  diversity:
    method: sharing
    sharing_radius: 0.15
    sharing_alpha: 1.0
    plan_elites: 1
    immigrant_fraction: 0.05

map_elites:
  batch_size: 64
  init_size: 256
  crossover_prob: 0.2
  descriptors: [sustained_velocity, energy_efficiency]
  bins: [16, 16]            # finer than quick: the larger budget can fill more cells
  ranges: [[0.0, 0.8], [0.0, 0.7]]
