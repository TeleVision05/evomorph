# The comparison experiment (brief section 9): python -m evomorph experiment --type comparison
#
# One file holds the whole design so a result can be traced to it: sim and
# fitness are the core defaults; evolution and map_elites are the engine
# settings every condition shares; experiment is what is compared and how.
# Conditions differ ONLY in what may evolve (and D in the algorithm): see
# evomorph/experiments/baselines.py and docs/EXPERIMENT.md.

sim:
  duration: 10.0
  timestep: 0.002
  settle_time: 1.0
  control_rate: 50.0
  init_noise: 0.01
  spawn_clearance: 0.005
  fall_tilt_deg: 75.0
  fall_contact_time: 0.25
  fall_contact_window: 1.0
  max_linear_speed: 5.0
  max_speed_per_size: 10.0
  max_angular_speed: 40.0
  max_height_gain: 1.0
  max_height_gain_per_size: 1.0
  max_ground_penetration: 0.05
  max_contact_penetration: 0.12

fitness:
  velocity_scale: 0.2
  tilt_scale: 1.0472
  lateral_ratio: 0.5
  yaw_scale: 0.7
  cot_scale: 2.0
  slip_penalty: 0.5
  airborne_allowance: 0.05
  airborne_scale: 0.5
  effort_scale: 0.5
  smooth_scale: 3.0
  still_distance: 0.1
  w_progress: 1.0
  w_upright: 1.0
  w_lateral: 1.0
  w_rotation: 1.0
  w_energy: 1.0
  w_slip: 1.0
  w_support: 1.0
  w_airborne: 1.0
  w_effort: 1.0
  w_smoothness: 1.0
  w_fall: 1.0
  w_still: 0.2
  penalty_cap: 2.0

# Engine settings shared by every condition. algorithm, mode, seed, budget,
# workers, the frozen templates and the evaluation runs are set per run by the
# experiment (evomorph/experiments/design.py), so their values here are unused.
evolution:
  algorithm: ga
  mode: joint
  seed: 0
  budget: 1441
  workers: 6                # process pool, hard-capped at 6 so the laptop stays usable
  frozen_body: quadruped
  frozen_controller: quadruped
  kind: cpg
  population_size: 24       # overridden by experiment.population_size when that is set
  elite_count: 2
  tournament_size: 3
  crossover_prob: 0.5
  max_generations: null     # must be null: every run stops on the simulation budget
  mutation:
    gene_rate: 0.12
    sigma: 0.10
    reset_rate: 0.02
    p_limb_pairs: 0.05
    p_segments: 0.05
    p_gait: 0.05
    p_phase: 0.20
    phase_sigma: 0.25
  diversity:
    method: sharing
    sharing_radius: 0.15
    sharing_alpha: 1.0
    plan_elites: 1
    immigrant_fraction: 0.05

# batch_size and init_size are set to the GA population size by the experiment
# (D starts from as many random genomes as the GA's generation 0).
map_elites:
  batch_size: 24
  init_size: 24
  crossover_prob: 0.2
  descriptors: [sustained_velocity, energy_efficiency]
  # 10 x 10 as in quick.yaml: a run of a few hundred genomes cannot fill the
  # 256 cells of research.yaml's 16 x 16.
  bins: [10, 10]
  ranges: [[0.0, 0.8], [0.0, 0.7]]

experiment:
  conditions: [controller, morphology, joint, joint_me]   # A, B, C, D
  n_seeds: 5              # search seeds 0-4, the same for every condition
  seed_start: 0
  # Simulations per run. One genome costs 11 (every training environment once),
  # so 1441 is 131 genomes (6-9 generations of 24 in the full run, because
  # protected individuals are not re-evaluated). It is what fits
  # 4 conditions x 5 seeds into 2.5 h at the throughput measured in the quick
  # run (3.89 simulations/s with 6 workers on this shared laptop):
  #   scripts/plan_budget.py results/experiments/comparison_quick
  # It is small: see docs/EXPERIMENT.md, "Budget for the full run".
  budget: 1441
  workers: 6              # capped at 6 whatever is asked
  train_suite: train      # 11 environments (evomorph/simulation/suites.py)
  test_suite: test        # 11 held-out environments, unseen terrain seeds
  train_seed: 0           # training environment i uses spawn seed 0 + i
  population_size: 24      # small, so the small budget still gives several (6-9) generations
  rescore_seeds: 3        # champion: 3 fresh spawn seeds x 11 environments per suite
  set_size: 10            # best 10 distinct genomes of the final population / archive
  set_seeds: 1            # set members: 1 fresh spawn seed x 11 environments per suite
  # --quick: a smoke test of the whole pipeline (every condition, the post-hoc
  # evaluation, the table and the plots), far too small to answer the question.
  quick:
    n_seeds: 2
    budget: 660           # 60 genomes x 11 = 5 generations of 12
    population_size: 12
    rescore_seeds: 1
    set_size: 4
