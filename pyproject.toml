[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evomorph"
version = "0.1.0"
description = "Software-only evolutionary robotics laboratory: co-evolving morphology and CPG locomotion in MuJoCo"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Developed and tested on 4.0.1 (see requirements-lock.txt); results are only
    # bit-identical within one MuJoCo version.
    "mujoco>=4.0,<5",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
evomorph = "evomorph.cli:main"

[tool.setuptools.packages.find]
include = ["evomorph*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running simulation sweeps (run with -m slow)",
]
