# Uses the ruff installed in the project venv so the hook and the editor
# always agree on the version. Install with: .venv/bin/pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: code-size
        name: file <= 500 lines, function <= 75 lines
        entry: .venv/bin/python scripts/check_sizes.py
        language: system
        types: [python]
